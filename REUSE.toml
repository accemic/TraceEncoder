# ---------------------------------------------------------------------------
# Artefact classes introduced by the consolidation into this repository: rule ONCE per
# class with directory globs, so files arriving with later migration steps are
# covered by the class, not by chasing individual paths.

# Demo capture data for the dashboard's hardware-free demo mode: recorded
# trace streams plus the instruction maps and symbol tables to decode them.
# The demo dataset, split BY PROVENANCE (maintainer decision, 2026-08-19).
#
# It used to be one blanket claim -- everything under demo/ as "2026 Accemic,
# CC-BY-4.0". A licence audit pointed out what that swept up: the console
# captures carry OpenSBI's banner and Linux's boot messages, and the .pcinfo
# listings are disassemblies of OpenSBI. Claiming copyright in someone else's
# program output, and licensing it out, is not a small inaccuracy -- it is the
# kind a reviewer finds first.
#
# The split below follows what each file actually IS.

# 1. Recordings: what our hardware measured. Trace byte streams and the raw
#    console ring dumps they came from. These are measurements -- facts about
#    a run, with no authorship to assert. CC0 says exactly that, instead of
#    claiming a copyright and then licensing it back out.
[[annotations]]
path = ["examples/dashboard/demo/*.bin", "examples/dashboard/demo/raw/*.bin"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Accemic Technologies GmbH"
SPDX-License-Identifier = "CC0-1.0"

# 2. Console transcripts: the guests' own output, cleaned of capture
#    artefacts only (see make_demo_console.py). The text is OpenSBI's and
#    Linux's, not ours; what is ours is the recording. CC0 again -- and the
#    copyright line names the upstreams, because they wrote what you read.
[[annotations]]
path = ["examples/dashboard/demo/console_*.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 Accemic Technologies GmbH (recording)", "OpenSBI contributors", "Linux kernel contributors"]
SPDX-License-Identifier = "CC0-1.0"

# 3a. Listings of the OPENSBI firmware images the Linux guests ran. A
#     disassembly is a derived work of the program it describes, so it
#     carries that program's licence -- OpenSBI is BSD-2-Clause. The symbol
#     and site maps of the same firmware are the same class.
#
#     NAMED INDIVIDUALLY ON PURPOSE. The first version of this split used
#     `demo/*.pcinfo`, which swept in mbv.pcinfo and tgc.pcinfo -- listings of
#     our own and MINRES' bare-metal programs, which have nothing to do with
#     OpenSBI. A glob that is convenient today mislabels the file someone
#     adds tomorrow; a new listing should have to be classified, not
#     absorbed.
[[annotations]]
path = [
    "examples/dashboard/demo/cva6_linux.pcinfo",
    "examples/dashboard/demo/cva6_linux64.pcinfo",
    "examples/dashboard/demo/rocket64.pcinfo",
    "examples/dashboard/demo/rocket2.pcinfo",
    "examples/dashboard/demo/symbols_sbi.map",
    "examples/dashboard/demo/sites_sbi.map",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "OpenSBI contributors"
SPDX-License-Identifier = "BSD-2-Clause"

# 3b. Listing of our own MicroBlaze V bare-metal program (trace_test), and of
#     the TGC5B example program. Both are Accemic sources; the listings
#     inherit from them, exactly as examples/kv260/common/tgc5b/prog/ does above.
[[annotations]]
path = ["examples/dashboard/demo/mbv.pcinfo", "examples/dashboard/demo/tgc.pcinfo"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Accemic Technologies GmbH"
SPDX-License-Identifier = "CERN-OHL-S-2.0 OR LicenseRef-Accemic-Commercial"

# 4. Everything else in demo/: our own program images and symbol maps, the
#    dataset README. hello_trace.hex is a copy of the TGC5B example program
#    and follows its source; see demo/README.md.
[[annotations]]
path = ["examples/dashboard/demo/*.elf", "examples/dashboard/demo/symbols_mbv.map", "examples/dashboard/demo/README.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Accemic Technologies GmbH"
SPDX-License-Identifier = "CC-BY-4.0"

# hello_trace.hex is a copy of examples/kv260/common/tgc5b/prog/hello_trace.hex and
