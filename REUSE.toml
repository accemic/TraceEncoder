# data with no comment syntax that could carry a header.
[[annotations]]
path = ["verification/ref_final/*.txt", "verification/ref_final/*.tsv"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Accemic Technologies GmbH"
SPDX-License-Identifier = "CERN-OHL-S-2.0 OR LicenseRef-Accemic-Commercial"

# Gate evidence: run logs and Vivado utilization/timing reports of the
# CTTE design, kept verbatim as the measurement record behind the gate
# verdicts. They are machine output and are not edited after the run, so
# they carry no in-file header; the copyright and license recorded here
# cover Accemic's contribution (the design under measurement and the
# measurement itself). The Vivado reports additionally carry the tool
# vendor's banner in their first line, which stays untouched.
[[annotations]]
path = ["verification/evidence/**/*.log", "verification/evidence/**/*.rpt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Accemic Technologies GmbH"
SPDX-License-Identifier = "CERN-OHL-S-2.0 OR LicenseRef-Accemic-Commercial"

# Vendored subset of the RISC-V trace specification's reference flow
# (https://github.com/riscv-non-isa/riscv-trace-spec). The Python models
# carry their own BSD-2-Clause headers; the two files below do not.
[[annotations]]
path = ["third_party/riscv-trace-spec-ref/README.md",
        "third_party/riscv-trace-spec-ref/scripts/common/__init__.py"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2019-2021 Siemens"
SPDX-License-Identifier = "BSD-2-Clause"

# The upstream repository's own licence document, kept verbatim for
# provenance and renamed from LICENSE: it carries the CC-BY-4.0 legal code,
# which upstream applies to the trace SPECIFICATION -- not to the Python
# models vendored next to it, which are BSD-2-Clause (see the README there).
# Under the old name it read like the licence of this directory's code and
# was skipped by `reuse` on top of that, so the contradiction stayed
# invisible. The annotation below records the document's own origin.
[[annotations]]
path = "third_party/riscv-trace-spec-ref/UPSTREAM-SPEC-LICENSE-CC-BY-4.0.txt"
precedence = "aggregate"
SPDX-FileCopyrightText = "Creative Commons Corporation"
SPDX-License-Identifier = "CC-BY-4.0"

