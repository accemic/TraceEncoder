        "examples/kv260/*/board/refs/*"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Accemic Technologies GmbH"
SPDX-License-Identifier = "CERN-OHL-S-2.0 OR LicenseRef-Accemic-Commercial"

# Pre-built KV260 demo apps: the bitstream (`.bit.bin`), its device-tree
# overlay, `shell.json`, the per-file `MANIFEST.sha256` and, for the Linux
# demos, `BOARD_SETUP.txt` -- extracted verbatim from the board-gated bundle
# series recorded in scripts/demo.pin. A bitstream is the built product of
# the Hardware IP and carries its license; the third-party cores compiled
# into it are licensed as stated in each example's README. The set is
# frozen by its manifest, so nothing in it can take a header.
[[annotations]]
path = "examples/kv260/*/fpga/prebuilt/*/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Accemic Technologies GmbH"
SPDX-License-Identifier = "CERN-OHL-S-2.0 OR LicenseRef-Accemic-Commercial"

