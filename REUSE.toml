# REUSE configuration for files that cannot carry an in-file SPDX header
# (e.g. plain-text version files, empty placeholders).

version = 1
SPDX-PackageName = "CEDARtools.TraceEncoder"
SPDX-PackageVersion = "1.0.0"
SPDX-PackageSupplier = "Accemic Technologies GmbH <info@accemic.com>"
SPDX-PackageDownloadLocation = "https://github.com/accemic/TraceEncoder"

[[annotations]]
path = ["VERSION", "**/.gitkeep", "**/.gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Accemic Technologies GmbH"
SPDX-License-Identifier = "ISC"

# Verible lint rule files: a list of +rule / -rule lines with # comments.
# They carry no SPDX header of their own, so the license is recorded here.

[[annotations]]
path = "**/.rules.verible_lint"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Accemic Technologies GmbH"
SPDX-License-Identifier = "ISC"

# Documentation images. Each `.drawio.png` IS its own editable source: the
# draw.io XML rides in a PNG text chunk, so opening the PNG in draw.io recovers
# the drawing. There is deliberately no sibling `.drawio` file -- two copies of
# one drawing drift, and the guard scripts/check_drawio_embedded.py (part of
# `make lint`) keeps it that way. No SPDX header survives a draw.io round-trip
# in any of these formats, so the license info lives here.
[[annotations]]
path = ["doc/images/*.png", "doc/images/*.svg"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Accemic Technologies GmbH"
SPDX-License-Identifier = "CC-BY-4.0"

# The Reference Manual, rendered from its AsciiDoc sources (maintained in
# Accemic's documentation repository) and shipped here as a PDF and a single
# self-contained HTML file. Build products carry no SPDX header of their own,
# and the legal chapter they render quotes SPDX expressions as text -- hence
# "override": this block is their whole declaration, the file is not parsed.
[[annotations]]
path = ["doc/rm-ctte.pdf", "doc/rm-ctte.html"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Accemic Technologies GmbH"
SPDX-License-Identifier = "CC-BY-4.0"

