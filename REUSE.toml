# It was CC-BY-4.0, and CC-BY expressly permits adaptations -- of a logo,
# which is the one thing a trade mark may not undergo. That put the file in
# direct conflict with TRADEMARKS.md in the same repository. A mark is never
# part of an open-source grant anyway; the usual answer, and the one Linux,
# Mozilla and Rust all use, is a separate trade-mark permission. That is what
# LicenseRef-Accemic-Trademark is: use it unaltered to identify Accemic
# products, do not modify it, do not use it as a badge of origin for anything
# else. The rest of the repository stays exactly as open as it was.
[[annotations]]
path = ["examples/dashboard/logo_acctech.svg"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Accemic Technologies GmbH"
SPDX-License-Identifier = "LicenseRef-Accemic-Trademark"

