# main.c) -- it merely runs ON the MINRES core; the core's licence is not the
# program's. Checked 2026-08-19, because the first draft of this split got it
# backwards.
[[annotations]]
path = ["examples/dashboard/demo/hello_trace.hex"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Accemic Technologies GmbH"
SPDX-License-Identifier = "CERN-OHL-S-2.0 OR LicenseRef-Accemic-Commercial"

