# ---------------------------------------------------------------------------
# Vendored Rocket reference generat (maintainer decision, 2026-08-19)
#
# `system-nexys-video.v` is FIRRTL output of the vivado-risc-v flow around
# rocket-chip -- 8.8 MB of machine-written Verilog per variant, with no
# in-file header and no sensible place to put one. It is committed because
# there is no fetch path for it and the recipe to regenerate it needs patches
# this repository does not carry; without it, `rocket_linux` and `rocket2`
# are unbuildable for anyone who does not already have the file.
#
# The generat mixes three upstreams, and the SPDX expression says so instead
# of picking the most convenient one: rocket-chip is BSD-3-Clause (Regents of
# the University of California) and Apache-2.0 (SiFive), the JTAG parts carry
# the chisel-jtag terms (BSD-3-Clause in substance), and the surrounding
# vivado-risc-v flow is MIT. The upstream licence texts sit next to the file
# as LICENSE.Berkeley, LICENSE.SiFive, LICENSE.jtag and
# LICENSE.vivado-risc-v.md, exactly as they were delivered.
[[annotations]]
path = [
    "examples/kv260/third_party/rocket_ref/system-nexys-video.v",
    "examples/kv260/third_party/rocket_ref/rocket64t2/system-nexys-video.v",
]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2012-2014 The Regents of the University of California", "SiFive, Inc.", "2021-2025 Eugene Tarassov"]
SPDX-License-Identifier = "BSD-3-Clause AND Apache-2.0 AND MIT"

# The upstream licence texts, delivered with the generat and left byte-identical.
[[annotations]]
path = [
    "examples/kv260/third_party/rocket_ref/LICENSE.Berkeley",
    "examples/kv260/third_party/rocket_ref/LICENSE.SiFive",
    "examples/kv260/third_party/rocket_ref/LICENSE.jtag",
    "examples/kv260/third_party/rocket_ref/LICENSE.vivado-risc-v.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2012-2016 The Regents of the University of California", "SiFive, Inc.", "2021-2025 Eugene Tarassov"]
SPDX-License-Identifier = "BSD-3-Clause AND Apache-2.0 AND MIT"

